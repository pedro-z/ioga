<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cura Interior · Meditação & Bem-Estar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #d4a84b;
      --gold-light: #f0d78c;
      --gold-dark: #a67c2d;
      --bg-deep: #0f0a05;
      --bg-warm: #1a120b;
      --text: #f5e6c8;
      --text-soft: #c9b896;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: 
        radial-gradient(ellipse at 20% 20%, rgba(212, 168, 75, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(166, 124, 45, 0.1) 0%, transparent 50%),
        linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-warm) 50%, #120c08 100%);
      color: var(--text);
      font-family: 'Cormorant Garamond', Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(1.5px 1.5px at 10% 20%, rgba(240, 215, 140, 0.4), transparent),
        radial-gradient(1px 1px at 30% 70%, rgba(212, 168, 75, 0.3), transparent),
        radial-gradient(1.5px 1.5px at 70% 30%, rgba(240, 215, 140, 0.35), transparent),
        radial-gradient(1px 1px at 90% 80%, rgba(212, 168, 75, 0.25), transparent);
      pointer-events: none;
      z-index: 0;
      animation: drift 40s ease-in-out infinite alternate;
    }

    @keyframes drift {
      0% { opacity: 0.6; transform: translateY(0); }
      100% { opacity: 1; transform: translateY(-12px); }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      width: 100%;
      text-align: center;
    }

    header { margin-bottom: 2.8rem; }

    .logo-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 1.1rem;
      display: block;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-weight: 600;
      font-size: clamp(1.7rem, 4.5vw, 2.6rem);
      letter-spacing: 0.18em;
      color: var(--gold-light);
      text-shadow: 0 0 28px rgba(212, 168, 75, 0.35);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      color: var(--text-soft);
      font-style: italic;
      letter-spacing: 0.08em;
      opacity: 0.9;
    }

    .divider {
      width: 70px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 1.3rem auto 0;
    }

    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.8rem;
      justify-items: center;
      padding: 0 0.4rem;
    }

    .btn-card {
      position: relative;
      width: 100%;
      max-width: 300px;
      border-radius: 14px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 
        0 10px 36px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(212, 168, 75, 0.25);
      border: 1px solid rgba(212, 168, 75, 0.35);
    }

    .btn-card:hover {
      transform: translateY(-8px) scale(1.025);
      box-shadow: 
        0 22px 55px rgba(0, 0, 0, 0.55),
        0 0 45px rgba(212, 168, 75, 0.28),
        0 0 0 1px rgba(212, 168, 75, 0.5);
      border-color: var(--gold);
    }

    .gif-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      background: #1a120b;
    }

    .gif-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.55s ease;
    }

    .btn-card:hover .gif-wrap img {
      transform: scale(1.07);
    }

    /* Overlay escuro + vinheta para o texto legível */
    .gif-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(to top, rgba(10, 6, 2, 0.82) 0%, rgba(10, 6, 2, 0.35) 40%, transparent 70%),
        radial-gradient(ellipse at center, transparent 40%, rgba(10, 6, 2, 0.45) 100%);
      pointer-events: none;
    }

    /* Texto sobreposto no GIF (estilo da referência) */
    .overlay-title {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18%;
      z-index: 2;
      padding: 0 0.9rem;
      font-family: 'Cinzel', serif;
      font-weight: 600;
      font-size: clamp(1.05rem, 3.2vw, 1.25rem);
      letter-spacing: 0.1em;
      line-height: 1.25;
      color: #f5e6c8;
      text-shadow: 
        0 1px 3px rgba(0,0,0,0.9),
        0 0 20px rgba(212, 168, 75, 0.4),
        0 0 40px rgba(0,0,0,0.6);
      text-transform: uppercase;
      pointer-events: none;
    }

    footer {
      margin-top: 3.2rem;
      font-size: 0.85rem;
      color: var(--text-soft);
      opacity: 0.5;
      letter-spacing: 0.06em;
    }

    @media (max-width: 640px) {
      .buttons-grid { gap: 1.4rem; }
      .btn-card { max-width: 280px; }
      header { margin-bottom: 2rem; }
      .overlay-title { bottom: 16%; font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <svg class="logo-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f0d78c"/>
            <stop offset="100%" stop-color="#d4a84b"/>
          </linearGradient>
        </defs>
        <circle cx="24" cy="24" r="22" fill="none" stroke="url(#g1)" stroke-width="1.5" opacity="0.55"/>
        <circle cx="24" cy="24" r="14" fill="none" stroke="url(#g1)" stroke-width="1" opacity="0.35"/>
        <path d="M24 8 C28 16 28 20 24 28 C20 20 20 16 24 8 Z" fill="url(#g1)" opacity="0.85"/>
        <path d="M12 20 C20 18 24 20 28 28 C20 26 16 22 12 20 Z" fill="url(#g1)" opacity="0.7"/>
        <path d="M36 20 C28 18 24 20 20 28 C28 26 32 22 36 20 Z" fill="url(#g1)" opacity="0.7"/>
        <circle cx="24" cy="24" r="4" fill="url(#g1)"/>
      </svg>
      <h1>CURA INTERIOR</h1>
      <p class="subtitle">Respire · Sinta · Transforme</p>
      <div class="divider"></div>
    </header>

    <nav class="buttons-grid" aria-label="Menu principal">
      <!-- Técnicas de Respiração -->
      <a href="tecnicas-respiracao.html" class="btn-card">
        <div class="gif-wrap">
          <img src="botao-tecnicas-respiracao.gif" alt="Técnicas de Respiração" loading="eager">
          <span class="overlay-title">Técnicas de<br>Respiração</span>
        </div>
      </a>

      <!-- Cura de Ansiedade -->
      <a href="cura-ansiedade.html" class="btn-card">
        <div class="gif-wrap">
          <img src="botao-cura-ansiedade.gif" alt="Cura de Ansiedade" loading="eager">
          <span class="overlay-title">Cura de<br>Ansiedade</span>
        </div>
      </a>

      <!-- Restabelecimento do Sono -->
      <a href="restabelecimento-sono.html" class="btn-card">
        <div class="gif-wrap">
          <img src="botao-relaxamento-sono.gif" alt="Restabelecimento do Sono" loading="eager">
          <span class="overlay-title">Restabelecimento<br>do Sono</span>
        </div>
      </a>
    </nav>

    <footer>
      <p>Encontre o caminho para o seu equilíbrio interior</p>
    </footer>
  </div>
</body>
</html>
